name: release

# Tag-triggered release. Push a tag like `tablo-v0.5.0` and CI builds signed
# installers for macOS / Windows / Linux, uploads them to a GitHub Release, and
# publishes the `latest.json` the in-app auto-updater reads.
#
# The app version the updater compares is the semver in src-tauri/tauri.conf.json
# (e.g. 0.5.0) — the tag is just the trigger + release label. Bump the config
# version before tagging the next release.
on:
  push:
    tags:
      - "tablo-v*"

# Least privilege by default: every job is read-only unless it opts into more.
permissions:
  contents: read

jobs:
  # Guardrail: a tag can only release if its commit is actually on `main`. Tags
  # aren't branch-bound, so pushing `tablo-v*` from a feature branch would
  # otherwise ship un-merged code. This cheap job runs first and blocks the build.
  guard:
    runs-on: ubuntu-latest
    # Read-only, un-gated, and ahead of `release` — so both pre-flight checks
    # fail before the environment asks you to approve anything.
    outputs:
      notes: ${{ steps.notes.outputs.body }}
    steps:
      # All actions pinned to a full commit SHA (not a movable tag) so a hijacked
      # or repointed tag can't inject code — the version is in the trailing comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0 # full history so --contains can see origin/main
      - name: Refuse to release a tag that isn't on main
        run: |
          if ! git branch -r --contains "${{ github.sha }}" --format='%(refname:short)' | grep -qx 'origin/main'; then
            echo "::error::${{ github.ref_name }} points at a commit that is not on main — refusing to release."
            exit 1
          fi

      # The release body comes from CHANGELOG.md.
      - name: Extract release notes
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#tablo-v}"
          # Print the body of the "## [<version>]" section, stopping at the next
          # one. Blank lines top and bottom are trimmed; the heading itself (and
          # so its date) never reaches the release page. `\r` is stripped because
          # checkout on the Windows runner can hand us CRLF.
          body=$(awk -v v="$version" '
            { sub(/\r$/, "") }
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { lines[++n] = $0; if (NF) { if (!first) first = n; last = n } }
            END { if (first) for (i = first; i <= last; i++) print lines[i] }
          ' CHANGELOG.md)
          if [ -z "$body" ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section — add one before tagging."
            exit 1
          fi
          # A line equal to the delimiter would close the value early and let the
          # rest of the file forge step outputs.
          if printf '%s\n' "$body" | grep -qx 'CHANGELOG_EOF'; then
            echo "::error::CHANGELOG.md contains the output delimiter CHANGELOG_EOF"
            exit 1
          fi
          {
            echo 'body<<CHANGELOG_EOF'
            printf '%s\n' "$body"
            echo
            echo '---'
            echo
            echo 'Download the installer for your platform below. Once installed, tablo updates itself automatically.'
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

  release:
    needs: guard
    # The only job that touches the signing key + publishes. Gate it behind a
    # protected environment — add yourself as a required reviewer in repo
    # Settings → Environments → "release" so a release pauses for approval before
    # the key is exposed. (An unconfigured environment is auto-created with no
    # gate, so this never blocks a release until you set the rules.)
    environment: release
    permissions:
      contents: write # create the release + upload assets
      id-token: write # OIDC token used to sign the provenance attestation
      attestations: write # write the build-provenance attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal macOS build covers Apple Silicon + Intel, so the
          # updater's latest.json carries a single, non-conflicting darwin entry.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      # All actions pinned to a full commit SHA (version in the trailing comment).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            libxdo-dev

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and release
        id: tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Update-integrity signing (NOT OS code-signing). Generated once with
          # `tauri signer generate`; the public key lives in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ needs.guard.outputs.notes }}
          releaseDraft: false
          # Must NOT be a prerelease: the updater endpoint reads
          # releases/latest/download/latest.json, which only points at the latest
          # full release.
          prerelease: false
          # tauri-action generates + merges latest.json across the matrix jobs
          # when the signing key is present.
          args: ${{ matrix.args }}

      # Publish a "<file>.sha256" next to each installer so install.sh / install.ps1
      # can verify the download and fail closed on a mismatch. Each matrix job
      # signs only its own artifacts; filenames don't collide across platforms.
      - name: Publish SHA-256 checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1"; else shasum -a 256 "$1"; fi; }
          n=0
          # Read from a redirect, not a pipe, so the loop runs in this shell and an
          # `exit 1` below actually fails the step.
          while read -r f; do
            # Windows hands back backslash paths, which neither the case-match nor
            # `-f` below resolves — v2.0.0 shipped with no Windows checksums because
            # of it. Normalize separators (and any stray CR) before matching.
            f="${f%$'\r'}"
            f="${f//\\//}"
            case "$f" in
              *.dmg|*.AppImage|*.deb|*.rpm|*.exe|*.msi) ;;
              *) continue ;;
            esac
            # Fail loud. Skipping here silently publishes a release whose installers
            # can't be verified, which fails install.sh / install.ps1 closed.
            [ -f "$f" ] || { echo "::error::installer not found on disk: $f"; exit 1; }
            ( cd "$(dirname "$f")" && sha "$(basename "$f")" ) > "${f}.sha256"
            gh release upload "${{ github.ref_name }}" "${f}.sha256" --clobber
            n=$((n + 1))
          done < <(echo '${{ steps.tauri.outputs.artifactPaths }}' | jq -r '.[]')
          # Every platform in the matrix produces at least one installer, so zero
          # checksums means the matching itself broke — don't let that pass green.
          [ "$n" -gt 0 ] || { echo "::error::no installer checksums published"; exit 1; }
          echo "published $n checksum(s)"

      # Cryptographic build provenance: a signed attestation tying each artifact
      # to this repo + workflow run, verifiable with
      # `gh attestation verify <file> --repo unravel-team/tablo`. Independent of
      # the release assets, so it holds even if a release is later tampered.
      - name: Collect artifact paths
        id: artifacts
        shell: bash
        run: |
          {
            echo 'paths<<EOF'
            echo '${{ steps.tauri.outputs.artifactPaths }}' | jq -r '.[]'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.artifacts.outputs.paths }}
